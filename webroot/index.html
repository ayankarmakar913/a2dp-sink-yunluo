<!doctype html>
<html>
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>A2DP Sink/Src (yunluo)</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:system-ui,sans-serif;margin:16px;background:#111;color:#eee}
    .card{background:#1c1c1c;border-radius:14px;padding:14px;margin:10px 0}
    button{position:relative;overflow:hidden;width:100%;padding:15px 14px;margin:8px 0;border:0;border-radius:12px;font-size:16px;font-weight:600;color:inherit;cursor:pointer;touch-action:manipulation;transition:transform .08s ease,filter .12s ease,opacity .12s ease}
    button::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .12s ease;pointer-events:none}
    button.pressed,button:active{transform:scale(.97);filter:brightness(1.18)} button.pressed::after{background:rgba(255,255,255,.10)}
    button.busy{opacity:.55}
    .primary{background:#2d7ff9;color:#fff}.warn{background:#f39c12;color:#111}.secondary{background:#333;color:#eee}
    .muted{color:#aaa;font-size:13px;line-height:1.35} #status{white-space:pre-wrap;font-family:monospace;font-size:12px;color:#bdb;min-height:2em} .hidden{display:none}
  </style>
</head>
<body>
  <h3>A2DP Sink/Source (Redmi Pad yunluo)</h3>
  <div class="card"><div id="mode">Mode: checking…</div><div class="muted" id="hint"></div></div>
  <div class="card">
    <button class="primary" id="toggle" onclick="run('toggle')">Toggle Source / Sink</button>
    <button class="warn hidden" id="restart" onclick="run('restart')">Restart A2DP Sink</button>
    <button class="secondary" onclick="run('status')">Refresh Status</button>
  </div>
  <div class="card"><div class="muted">Output</div><div id="status"></div></div>
  <div class="muted">If controls don’t work, use: <code>su -c /data/adb/a2dp-sink-yunluo toggle|restart</code></div>
<script>
const SINK="/data/adb/a2dp-sink-yunluo";
document.querySelectorAll('button').forEach(b=>{const d=()=>b.classList.add('pressed'),u=()=>b.classList.remove('pressed');['pointerdown','touchstart','mousedown'].forEach(e=>b.addEventListener(e,d,{passive:true}));['pointerup','pointercancel','pointerleave','touchend','touchcancel','mouseup','mouseleave','blur'].forEach(e=>b.addEventListener(e,u,{passive:true}));});
function setStatus(t){document.getElementById('status').textContent=t||"";}
function busy(on){document.querySelectorAll('button').forEach(b=>b.classList.toggle('busy',!!on));}
function setMode(text){setStatus(text||"");const sink=/mode:\s*SINK/i.test(text||"")||/A2DP Sink State:\s*Enabled/i.test(text||"");const src=/mode:\s*SOURCE/i.test(text||"")||/A2DP Sink State:\s*Disabled/i.test(text||"");const m=document.getElementById('mode'),r=document.getElementById('restart'),h=document.getElementById('hint'),t=document.getElementById('toggle');if(sink){m.textContent="Mode: SINK (receiver)";r.classList.remove('hidden');h.textContent="No sound? Try toggling BT off/on on both devices, or Restart.";if(t)t.textContent="Toggle Source";}else if(src){m.textContent="Mode: SOURCE (normal Bluetooth output)";r.classList.add('hidden');h.textContent="Toggle to SINK to receive audio.";if(t)t.textContent="Toggle Sink";}else{m.textContent="Mode: unknown (tap Refresh)";if(t)t.textContent="Toggle Source / Sink";}}
function cbWrap(fn){const id="__a2dp_cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);window[id]=function(){try{fn.apply(null,arguments);}finally{try{delete window[id];}catch(e){}}};return id;}
function apiExec(cmd,cb){try{const obj=(typeof ksu!=='undefined'&&ksu)?ksu:(typeof apatch!=='undefined'&&apatch)?apatch:(typeof kernelsu!=='undefined'&&kernelsu)?kernelsu:null;if(obj&&typeof obj.exec==='function'){const done=(a,b,c)=>{if(typeof a==='string'&&b===undefined&&c===undefined)return cb(a);cb((b!=null?String(b):"")+(c?("\n"+c):""));};const id=cbWrap(done);let r;try{r=obj.exec(cmd,"{}",id);}catch(e1){try{r=obj.exec(cmd,id);}catch(e2){try{r=obj.exec(cmd);}catch(e3){}}}if(r&&typeof r.then==='function'){r.then(v=>cb(typeof v==='string'?v:JSON.stringify(v))).catch(e=>cb(String(e)));return;}if(typeof r==='string'){cb(r);return;}setTimeout(()=>{},0);return;}}catch(e){cb("WebUI error: "+e+"\n\nRun manually:\n"+cmd);return;}cb("WebUI exec API not available. Use manager Action or:\n"+cmd);}
function run(arg){busy(true);setStatus("Running: "+arg+" … (if stuck, use Action/terminal)");apiExec("sh "+SINK+" "+arg+" 2>&1; echo; echo ---; sh "+SINK+" status 2>&1",(out)=>{busy(false);setMode(out);});}
run('status');
</script>
</body></html>
